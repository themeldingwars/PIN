name: CI

on: [push, pull_request, workflow_dispatch]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    name: ${{ matrix.platform.name }} ${{ matrix.dotnet.name }}
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Linux, os: ubuntu-24.04 }
          - { name: Windows, os: windows-2025 }
          - { name: macOS, os: macos-15 }
        dotnet:
          - { name: .NET 10, version: "10.0.x" }
          - { name: .NET 11, version: "11.0.x" }

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup .NET ${{ matrix.dotnet.version }} SDK
        id: setup-dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet.version }}
      - name: Enforce SDK Version
        run: dotnet new globaljson --sdk-version ${{ steps.setup-dotnet.outputs.dotnet-version }} --force
      - name: Verify SDK Installation
        run: dotnet --info
        continue-on-error: true
      - name: Install Dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test --configuration Release --no-build --logger "console;verbosity=detailed" 2>&1 | tee "$RUNNER_TEMP/test-output.log"
      - name: Report test output
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/test-output.log" ]; then
            tail -n 40 "$RUNNER_TEMP/test-output.log" | while IFS= read -r line; do echo "::error::$line"; done
          fi
      - name: Publish
        if: matrix.platform.name == 'Windows' && matrix.dotnet.name == '.NET 10'
        run: |
          dotnet publish UdpHosts/GameServer/GameServer.csproj --runtime win-x64 --no-self-contained --configuration Release -p:DebugType=None -p:DebugSymbols=false -p:PublishReadyToRun=true -o Publish
          dotnet publish UdpHosts/MatrixServer/MatrixServer.csproj --runtime win-x64 --no-self-contained --configuration Release -p:DebugType=None -p:DebugSymbols=false -p:PublishReadyToRun=true -o Publish
          dotnet publish WebHosts/WebHostManager/WebHostManager.csproj --runtime win-x64 --no-self-contained --configuration Release -p:DebugType=None -p:DebugSymbols=false -p:PublishReadyToRun=true -o Publish
          cp ./Start.cmd ./Publish
          cp ./README.md ./Publish
          cp ./CHANGELOG.md ./Publish
      - name: Verify GameServer publish payload
        if: matrix.platform.name == 'Windows' && matrix.dotnet.name == '.NET 10'
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $PWD 'Publish'
          $executable = Join-Path $publishDirectory 'GameServer.exe'
          if (-not (Test-Path -LiteralPath $executable)) {
            throw 'GameServer publish is missing GameServer.exe.'
          }

          # A framework-dependent single-file publish keeps Bitter and all other managed
          # dependencies in GameServer.exe, so users cannot receive a mismatched loose payload.
          $unexpectedFiles = @('GameServer.dll', 'GameServer.deps.json') |
            Where-Object { Test-Path -LiteralPath (Join-Path $publishDirectory $_) }
          if ($unexpectedFiles) {
            throw "GameServer was not bundled as a single file; found: $($unexpectedFiles -join ', ')"
          }

          if ((Get-Item -LiteralPath $executable).Length -lt 1MB) {
            throw 'GameServer.exe is too small to contain its managed dependency bundle.'
          }
      - name: Upload Artifact
        if: matrix.platform.name == 'Windows' && matrix.dotnet.name == '.NET 10'
        uses: actions/upload-artifact@v6
        with:
          name: PIN-${{ github.sha }}
          path: Publish
          include-hidden-files: true
