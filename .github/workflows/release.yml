name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, e.g. v1.3.0. Leave blank to derive the version from Directory.Build.props.'
        required: false
        default: ''
      prerelease:
        description: 'Mark this release as a pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build-and-release:
    name: Build & Release (Windows x64)
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.release_tag }}" -ne "") {
            $tag = "${{ github.event.inputs.release_tag }}"
          } else {
            $match = [regex]::Match((Get-Content -Raw 'Directory.Build.props'), '<Version>([^<]+)</Version>')
            if ($match.Success) { $tag = "v$($match.Groups[1].Value)" }
            else { throw "Could not derive a version from Directory.Build.props. Provide release_tag." }
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Resolved release tag: $tag"

      - name: Publish GameServer
        run: >
          dotnet publish UdpHosts/GameServer/GameServer.csproj
          --configuration Release
          --runtime win-x64
          --no-self-contained
          -p:PublishReadyToRun=true
          -p:DebugType=None -p:DebugSymbols=false
          -o Publish

      - name: Publish MatrixServer
        run: >
          dotnet publish UdpHosts/MatrixServer/MatrixServer.csproj
          --configuration Release
          --runtime win-x64
          --no-self-contained
          -p:PublishReadyToRun=true
          -p:DebugType=None -p:DebugSymbols=false
          -o Publish

      - name: Publish WebHostManager
        run: >
          dotnet publish WebHosts/WebHostManager/WebHostManager.csproj
          --configuration Release
          --runtime win-x64
          --no-self-contained
          -p:PublishReadyToRun=true
          -p:DebugType=None -p:DebugSymbols=false
          -o Publish

      - name: Bundle and verify release files
        shell: pwsh
        run: |
          function Assert-GameServerPayload([string] $directory) {
            $executable = Join-Path $directory 'GameServer.exe'
            if (-not (Test-Path -LiteralPath $executable)) {
              throw 'GameServer payload is missing GameServer.exe.'
            }

            # GameServer is deliberately a framework-dependent single-file app. Its managed
            # dependency closure (including Bitter) must be inside the executable rather than
            # relying on a loose DLL which can be omitted or separated during extraction.
            $unexpectedFiles = @('GameServer.dll', 'GameServer.deps.json') |
              Where-Object { Test-Path -LiteralPath (Join-Path $directory $_) }
            if ($unexpectedFiles) {
              throw "GameServer was not bundled as a single file; found: $($unexpectedFiles -join ', ')"
            }

            if ((Get-Item -LiteralPath $executable).Length -lt 1MB) {
              throw 'GameServer.exe is too small to contain its managed dependency bundle.'
            }
          }

          Assert-GameServerPayload (Join-Path $PWD 'Publish')

          Copy-Item Start.cmd Publish\Start.cmd
          Copy-Item README.md Publish\README.md
          Copy-Item CHANGELOG.md Publish\CHANGELOG.md
          $zip = "PIN-${{ steps.tag.outputs.tag }}-win-x64.zip"
          Compress-Archive -Path Publish\* -DestinationPath $zip -Force

          $verificationDirectory = Join-Path $env:RUNNER_TEMP 'pin-release-verify'
          Remove-Item -LiteralPath $verificationDirectory -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $zip -DestinationPath $verificationDirectory -Force
          Assert-GameServerPayload $verificationDirectory

          Get-ChildItem $zip | Select-Object Name, Length

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $zip = "PIN-$tag-win-x64.zip"
          $isPrerelease = "${{ github.event.inputs.prerelease }}" -eq "true"

          gh release view $tag --json tagName *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)

          if ($releaseExists) {
            Write-Host "Release $tag already exists, updating assets."
            gh release upload $tag $zip --clobber
          } else {
            # NB: build the argument list dynamically. Passing an empty string variable
            # (e.g. an unset --prerelease) makes pwsh 7.3+ hand gh a literal empty
            # argument, which gh treats as an asset glob -> "no matches found for ``".
            $releaseArgs = @('release','create', $tag, $zip, '--title', $tag, '--generate-notes', '--target', $env:GITHUB_SHA)
            if ($isPrerelease) { $releaseArgs += '--prerelease' }
            gh @releaseArgs
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Leave a clearly-marked slot for the patched FirefallClient.exe. CI cannot build it,
          # so it must be attached manually as an Asset on the release page (see README step 6).
          $slot = "`n`n---`n## Patched client (manual step)`n`nThe patched **FirefallClient.exe** is NOT built by this workflow. Attach it to this release's **Assets** (or drag it onto the release page) before sharing the release. See README step 6."
          $body = gh release view $tag --json body --jq .body
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($null -ne $body -and $body -notmatch "Patched client \(manual step\)") {
            $notesFile = New-TemporaryFile
            Set-Content -Path $notesFile -Value ($body + $slot) -Encoding utf8
            gh release edit $tag --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Remove-Item $notesFile
          }

          $url = gh release view $tag --json url --jq .url
          Write-Host "Release URL: $url"
          Write-Host ""
          Write-Host "REMINDER: Attach FirefallClient.exe manually to the Assets of release $tag."
          Write-Host "  Tip: drag-and-drop onto the release page at $url"
